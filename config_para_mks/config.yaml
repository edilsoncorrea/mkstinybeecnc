board: MKS TinyBee V1.0 XXYYZ
name: CNC-MKS-TinyBee

kinematics:
  Cartesian:

i2so:
  bck_pin: gpio.25
  data_pin: gpio.27
  ws_pin: gpio.26

spi:
  miso_pin: gpio.19
  mosi_pin: gpio.23
  sck_pin: gpio.18

sdcard:
  cs_pin: gpio.5
  # uses TH2 IO34 active low - MAKE SURE jumper J2 is set to SDDET!!!
  card_detect_pin: gpio.34:low

stepping:
  engine: I2S_STATIC
  idle_ms: 255
  pulse_us: 4
  dir_delay_us: 1
  disable_delay_us: 2

axes:
  shared_stepper_disable_pin: NO_PIN
  # homing_runs: 2 — 2 ciclos de approach/pulloff para melhor precisão no auto-squaring do Y
  # NOTA: homing_runs é suportado pelo FluidNC mas pode não ser reconhecido por schemas YAML externos

  x:
    steps_per_mm: 40
    max_rate_mm_per_min: 8000.000
    acceleration_mm_per_sec2: 80.000
    max_travel_mm: 2500.000
    soft_limits: false
    homing:
      cycle: 2
      positive_direction: false
      mpos_mm: 0.000
      feed_mm_per_min: 300.000
      seek_mm_per_min: 1500.000
      settle_ms: 500
      seek_scaler: 1.100
      feed_scaler: 1.100

    motor0:
      # X- endstop — conector X-LIMIT da placa (gpio.33)
      limit_neg_pin: gpio.33:low:pu
      # X+ endstop — GPIO livre (gpio.4), requer fiação adaptada
      limit_pos_pin: gpio.4:low:pu
      hard_limits: true
      pulloff_mm: 4.000
      stepstick:
        step_pin: I2SO.1
        direction_pin: I2SO.2
        disable_pin: I2SO.0

  y:
    steps_per_mm: 40
    max_rate_mm_per_min: 8000.000
    acceleration_mm_per_sec2: 70.000
    max_travel_mm: 1250.000
    soft_limits: false
    homing:
      cycle: 3
      positive_direction: false
      mpos_mm: 0.000
      feed_mm_per_min: 300.000
      seek_mm_per_min: 2000.000
      settle_ms: 500
      seek_scaler: 1.100
      feed_scaler: 1.100

    # motor0 = lado A do pórtico — driver Y da placa
    motor0:
      # Y- lado A — conector Y-LIMIT da placa (gpio.32)
      limit_neg_pin: gpio.32:low:pu
      # Y+ compartilhado entre motor0 e motor1 — GPIO livre (gpio.14)
      limit_pos_pin: gpio.14:low:pu
      hard_limits: true
      pulloff_mm: 4.000
      stepstick:
        step_pin: I2SO.4
        direction_pin: I2SO.5
        disable_pin: I2SO.3

    # motor1 = lado B do pórtico — driver E0 da placa
    # Endstops independentes habilitam auto-squaring no homing
    motor1:
      # Y- lado B — GPIO livre (gpio.13), requer fiação adaptada
      limit_neg_pin: gpio.13:low:pu
      # Y+ compartilhado — mesmo pino do motor0
      limit_pos_pin: gpio.14:low:pu
      hard_limits: true
      pulloff_mm: 4.000
      stepstick:
        # Slot E0: I2SO.9 (enable), I2SO.10 (step), I2SO.11 (dir)
        step_pin: I2SO.10
        direction_pin: I2SO.11
        disable_pin: I2SO.9

  z:
    steps_per_mm: 200.000
    max_rate_mm_per_min: 8000.000
    acceleration_mm_per_sec2: 60.000
    max_travel_mm: 80.000
    soft_limits: false
    homing:
      cycle: 1
      positive_direction: true
      mpos_mm: 0.000
      feed_mm_per_min: 300.000
      seek_mm_per_min: 500.000
      settle_ms: 500
      seek_scaler: 1.100
      feed_scaler: 1.100

    motor0:
      # Z+ endstop (homing sobe) — conector Z-LIMIT da placa (gpio.22)
      limit_pos_pin: gpio.22:low:pu
      # Z- endstop — GPIO livre (gpio.2), conector 3D Touch da placa
      limit_neg_pin: gpio.2:low:pu
      hard_limits: true
      pulloff_mm: 3.000
      stepstick:
        step_pin: I2SO.7
        direction_pin: I2SO.8
        disable_pin: I2SO.6

probe:
  pin: gpio.35:low
  check_mode_start: true

control:
  safety_door_pin: NO_PIN
  # on MT_DET connector — compartilhado com probe, use apenas um por vez
  #reset_pin: gpio.35:low
  # on TH1 connector
  feed_hold_pin: gpio.36:low
  # on TB connector
  cycle_start_pin: gpio.39:low
  macro0_pin: NO_PIN
  macro1_pin: NO_PIN
  macro2_pin: NO_PIN
  macro3_pin: NO_PIN

coolant:
  # Heated Bed Terminal Block
  flood_pin: i2so.16
  # HE0 Terminal Block
  mist_pin: i2so.17
  delay_ms: 0

# spindle PWM signal
PWM:
  pwm_hz: 2500
  # on EXP1 IO17 connector — sem pulsos no boot (preferível ao IO15)
  # IO15 dá pulsos curtos no boot que podem ativar o spindle acidentalmente
  output_pin: gpio.17:high
  s0_with_disable: true
  tool_num: 0
  spinup_ms: 4000
  spindown_ms: 4000
  speed_map: 0=0.000% 12000=100.000%

#Laser:
#  pwm_hz: 5000
#  # on 3D Touch connector (has pdwn + PWM) — gpio.2 em uso para Z-
#  # se ativar laser, liberar gpio.2 do Z- e usar outro GPIO
#  output_pin: gpio.2:high:pd
#  s0_with_disable: true
#  tool_num: 1
#  speed_map: 0=0.000% 1000=100.000%

start:
  must_home: false
